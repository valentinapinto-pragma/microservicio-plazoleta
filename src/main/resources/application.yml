server:
  port: 8082

spring:
  application:
    name: microservicio-plazoleta

  datasource:
    url: jdbc:mysql://localhost:3306/plazoleta_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# comunicacion con otros microservicios (OpenFeign)
services:
  users:
    url: ${USERS_SERVICE_URL:http://localhost:8081/users}
  messaging:
    url: ${MESSAGING_SERVICE_URL:http://localhost:8084/messages}
  traceability:
    url: ${TRACEABILITY_SERVICE_URL:http://localhost:8083/traceability}