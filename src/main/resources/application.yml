server:
  port: 8082

spring:
  application:
    name: microservicio-plazoleta

  datasource:
    url: jdbc:mysql://localhost:3306/plazoleta_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuración para comunicarnos con el microservicio de usuarios (OpenFeign)
services:
  users:
    url: http://localhost:8081/users
